import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

// PiliNara 使用 Gahiao/libmpv-android-video-build 的滚动 release：
// 每次 fork 的 Actions 构建都会更新 libmpv-latest，App 构建时自动拉最新 jar。
// 不再优先使用 android/libs 下的本地 jar，避免工作区残留旧库导致「以为更新了其实没更新」。
def libmpvBaseUrl = "https://github.com/Gahiao/libmpv-android-video-build/releases/latest/download"
def libmpvAbis = ["arm64-v8a", "armeabi-v7a", "x86_64"]

def sha256 = { File file ->
    MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(file.toPath())).encodeHex().toString()
}

def openUrl = { String url ->
    def connection = new URL(url).openConnection()
    connection.connectTimeout = 15000
    connection.readTimeout = 120000
    connection
}

// Java 的证书链在本机可能不完整（常见于代理/杀软中间人证书），表现为
// PKIX path building failed。系统 curl 走 Windows/macOS/Linux 的证书库，
// 通常不受影响，因此 Java 失败时自动用它兜底。
def curlDownload = { String url, File dest ->
    def part = new File(dest.parentFile, dest.name + '.part')
    if (part.exists()) {
        part.delete()
    }
    def process
    try {
        process = new ProcessBuilder(
            'curl', '--fail', '--location', '--silent', '--show-error',
            '--retry', '3', '--retry-delay', '1', '--connect-timeout', '20',
            '--output', part.absolutePath, url
        ).redirectErrorStream(true).start()
    } catch (IOException e) {
        throw new GradleException("系统没有可用的 curl：${e.message}")
    }
    def output = process.inputStream.getText('UTF-8')
    def code = process.waitFor()
    if (code != 0 || !part.exists() || part.length() == 0) {
        part.delete()
        throw new GradleException("curl 下载失败 exit=${code}: ${output.trim()}")
    }
    java.nio.file.Files.move(
        part.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING
    )
}

// 不能直接对 URLConnection 调 Groovy 的 withInputStream（Gradle 的
// HttpsURLConnectionImpl 没有这个动态方法），先取 inputStream 再拷贝。
def download = { String url, File dest ->
    try {
        def connection = openUrl(url)
        try {
            def code = connection.responseCode
            if (code != 200) {
                throw new GradleException("下载失败 HTTP ${code}: ${url}")
            }
            def input = connection.inputStream
            try {
                dest.withOutputStream { out -> out << input }
            } finally {
                input.close()
            }
        } finally {
            connection.disconnect()
        }
    } catch (Throwable javaError) {
        dest.delete()
        println "Java 下载失败（${javaError.class.simpleName}），改用系统 curl：${url}"
        try {
            curlDownload(url, dest)
        } catch (Throwable curlError) {
            throw new GradleException(
                "下载失败：${url}\nJava: ${javaError.message}\ncurl: ${curlError.message}",
                curlError
            )
        }
    }
}

tasks.register("downloadLibmpv") {
    doLast {
        def outputDir = file("$buildDir/output")
        outputDir.deleteDir()
        outputDir.mkdirs()

        // 可选离线目录：把 SHA256SUMS 和三个 jar 放进来即可跳过网络。
        // 适合 Java 证书链损坏或 GitHub 下载过慢的环境。
        def localDir = file("$projectDir/libs/libmpv-local")
        def localSumsFile = new File(localDir, "SHA256SUMS")
        def useLocal = localSumsFile.exists() &&
            libmpvAbis.every { abi -> new File(localDir, "default-${abi}.jar").exists() }

        def cacheDir = file("$buildDir/libmpv-latest")
        cacheDir.mkdirs()

        def sumsFile = useLocal ? localSumsFile : file("${cacheDir}/SHA256SUMS")
        if (useLocal) {
            println "Using local libmpv jars from ${localDir}"
        } else {
            download("${libmpvBaseUrl}/SHA256SUMS", sumsFile)
        }

        def sums = [:]
        sumsFile.getText("UTF-8").readLines().each { line ->
            def parts = line.trim().split(/\s+/)
            if (parts.length >= 2) {
                sums[parts[parts.length - 1]] = parts[0]
            }
        }

        libmpvAbis.each { abi ->
            def name = "default-${abi}.jar"
            def dest = useLocal ? new File(localDir, name) : file("${cacheDir}/${name}")
            def expected = sums[name]
            if (expected == null) {
                throw new GradleException("SHA256SUMS 中缺少 ${name}，请先运行 libmpv fork 的 Build workflow")
            }
            if (!useLocal && (!dest.exists() || sha256(dest) != expected)) {
                println "Downloading ${name} from ${libmpvBaseUrl}"
                dest.delete()
                download("${libmpvBaseUrl}/${name}", dest)
            }
            def actual = sha256(dest)
            if (actual != expected) {
                throw new GradleException("SHA-256 校验失败: ${name}")
            }
            project.copy {
                from dest
                into outputDir
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("downloadLibmpv")
}
